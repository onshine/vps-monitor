name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile vps_monitor.py
      - run: python vps_monitor.py check
      - run: python test_parser.py
      - run: docker build -t vps-monitor:test .
