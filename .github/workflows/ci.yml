name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile vps_monitor.py
      - run: python vps_monitor.py check
        env:
          MONITOR_DATA_DIR: ${{ runner.temp }}/vps-monitor
      - run: python test_parser.py
      - run: shellcheck install.sh quick-install.sh vps-monitorctl
      - run: docker build -t vps-monitor:test .
