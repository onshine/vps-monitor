services:
  vps-monitor:
    build: .
    image: ghcr.io/onshine/vps-monitor:latest
    container_name: vps-monitor
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./data:/data
      - /sys/class/block:/sys/class/block:ro
    mem_limit: 96m
    mem_reservation: 64m
    cpus: 0.20
    pids_limit: 8
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
